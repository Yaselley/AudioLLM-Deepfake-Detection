model:
  # LLM Settings
  # llm_path: "meta-llama/Llama-3.1-8B-Instruct" 
  # llm_type: "llama" # "qwen2", "qwen3", "llama"
  llm_path: "/netscratch/fkallel/models/Qwen3.5-0.8B/" 
  llm_type: "qwen3.5" # "qwen2", "qwen3", "llama"

  # Audio Encoder Settings
  audio_encoder_path: "/ds-slt/audio_weights/xlsr2_300m.pt"
  audio_encoder_type: "wav2vec2" 
  audio_encoder_source: "fairseq" 

  freeze_audio_encoder: false
  
  # LoRA Settings
  lora: false
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  
  # Special Tokens (optional)
  special_tokens: []

data:
  train_path:
    - "/netscratch/fkallel/SALMONN/data/my_hir_sdd_train_2_structured.json"
  val_path:
    - "/netscratch/fkallel/SALMONN/data/my_hir_sdd_val_2_structured.json"
  test_path: "/netscratch/fkallel/SALMONN/data/my_hir_sdd_test_2_structured.json"
  prompt_path: "prompts/train_prompt.json"

train:
  batch_size: 2
  epochs: 1
  lr: 1e-5          # Global fallback LR
  lr_adapter: 1e-5  
  lr_audio: 1e-6    # Lower LR for full fine-tuning of Whisper
  lr_lora: 1e-5     # Standard LoRA LR
  num_workers: 4
  seed: 42
  grad_accum_steps: 1
  grpo:
    enabled: true
    start_epoch: 0
    num_rollouts: 4
    max_new_tokens: 160
    temperature: 0.8
    top_p: 0.9
    repetition_penalty: 1.1
    clip_epsilon: 0.2
    kl_beta: 0.1
    log_freq: 50

output_dir: "output_grpo_other/qwen3.5_0.8B_no_lora_2_myhir_asvspoof19_reasoning"