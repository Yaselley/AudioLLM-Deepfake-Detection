# Example config enabling the hidden-state MLP adaptor.
# This keeps the base LLM frozen or LoRA-tuned, and adds a small classifier
# trained on the pooled final hidden state from the model.

data:
  train_path: data/asv19_train.jsonl
  val_path: data/asv19_val.jsonl
  prompt_path: prompts/train_prompt.json

train:
  batch_size: 4
  epochs: 5
  lr: 1.0e-05
  lr_adapter: 1.0e-05
  lr_audio: 1.0e-06
  lr_lora: 1.0e-05
  num_workers: 4
  seed: 2
  grad_accum_steps: 1

model:
  llm_path: Qwen/Qwen3.5-0.8B
  llm_type: qwen3.5
  lora: true
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  mlp_adaptor: true
  mlp_hidden_dim: 768
  mlp_dropout: 0.1
  mlp_num_classes: 2
  mlp_loss_weight: 0.5
  special_tokens: []
  audio_encoder_path: openai/whisper-large-v3
  audio_encoder_type: whisper
  audio_encoder_source: huggingface
  freeze_audio_encoder: false
  use_opensmile: false
  opensmile_only: false

output_dir: outputs/mlp_adaptor_example
