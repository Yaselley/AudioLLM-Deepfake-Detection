# Best Suite baseline (no OpenSmile): Whisper + Qwen-0.5B, NoLoRA unfrozen, seed 2
# Matches results/Suite/NoLora/whisper/Qwen-0.5B (91.09% avg macro F1)
data:
  train_path: data/asv19_train.jsonl
  val_path: data/asv19_val.jsonl
  prompt_path: prompts/train_prompt.json
train:
  batch_size: 4
  epochs: 5
  lr: 1.0e-05
  lr_adapter: 1.0e-05
  lr_audio: 1.0e-06
  lr_lora: 1.0e-05
  num_workers: 4
  seed: 2
  grad_accum_steps: 1
model:
  llm_path: Qwen/Qwen2.5-0.5B-Instruct
  llm_type: qwen2
  lora: false
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  special_tokens: []
  audio_encoder_path: openai/whisper-large-v3
  audio_encoder_type: whisper
  audio_encoder_source: huggingface
  freeze_audio_encoder: false
  use_opensmile: false
output_dir: outputs/suite_best_no_opensmile
