# Best OpenSmile-after model: Whisper + Qwen-0.5B, LoRA alpha=256, stage 2, seed 2
# Matches results/OpenSmile-After/Lora-256/unfrozen/whisper/Qwen-0.5B (94.42% avg macro F1)
#
# Train with:
#   python train_tokens_opensmile_stage2.py \
#     --config configs/opensmile_after_best.yaml \
#     --pretrained_checkpoint <stage1_run_dir> \
#     --checkpoint_epoch best
data:
  train_path: data/asv19_train.jsonl
  val_path: data/asv19_val.jsonl
  prompt_path: prompts/train_prompt_opensmile_after.json
train:
  batch_size: 2
  epochs: 5
  lr: 1e-05
  lr_adapter: 1e-05
  lr_audio: 1e-06
  lr_lora: 1e-05
  num_workers: 4
  seed: 2
  grad_accum_steps: 1
model:
  llm_path: Qwen/Qwen2.5-0.5B-Instruct
  llm_type: qwen2
  audio_encoder_path: openai/whisper-large-v3
  audio_encoder_type: whisper
  audio_encoder_source: huggingface
  freeze_audio_encoder: false
  lora: true
  lora_rank: 64
  lora_alpha: 256
  lora_dropout: 0.05
  special_tokens: []
  use_opensmile: true
  opensmile_only: false
output_dir: outputs/opensmile_after_best
