model:
  # LLM Settings
  # llm_path: "meta-llama/Llama-3.1-8B-Instruct" 
  # llm_type: "llama" # "qwen2", "qwen3", "llama"
  llm_path: "Qwen/Qwen2.5-7B-Instruct" 
  llm_type: "qwen2" # "qwen2", "qwen3", "llama"

  # Audio Encoder Settings
  # audio_encoder_path: "openai/whisper-large-v2"
  # audio_encoder_type: "whisper" 
  
  # For Fairseq Wav2Vec2
  # audio_encoder_path: "/netscratch/yelkheir/ssl_models/xlsr2_300m.pt"
  # audio_encoder_type: "wav2vec2"
  # audio_encoder_source: "fairseq" # "huggingface" or "fairseq" or "unil"

  # For UniL/Microsoft WavLM
  # audio_encoder_path: "/netscratch/yelkheir/DeepFense/DeepFense/deepfense/models/frontends/WavLM-Large.pt"
  # audio_encoder_type: "wavlm"
  # audio_encoder_source: "unil" # "huggingface" or "unil"

  freeze_audio_encoder: false
  
  # LoRA Settings
  lora: true
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  
  # Special Tokens (optional)
  special_tokens: [] # e.g. ["<SpeechHere>"] if not already handled by logic

data:
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  prompt_path: "prompts/train_prompt.json"

train:
  batch_size: 4
  epochs: 5
  lr: 1e-4          # Global fallback LR
  lr_adapter: 1e-4  
  lr_audio: 1e-5    # Lower LR for full fine-tuning of Whisper
  lr_lora: 2e-4     # Standard LoRA LR
  num_workers: 4

output_dir: "output_v3"
