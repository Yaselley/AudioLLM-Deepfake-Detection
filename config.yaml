model:
  # LLM Settings
  llm_path: "meta-llama/Llama-3.1-8B-Instruct" 
  llm_type: "llama" # "qwen2", "qwen3", "llama"
  
  # Audio Encoder Settings
  audio_encoder_path: "openai/whisper-large-v2"
  audio_encoder_type: "whisper" 
  freeze_audio_encoder: true
  
  # LoRA Settings
  lora: true
  lora_rank: 8
  
  # Special Tokens (optional)
  special_tokens: [] # e.g. ["<SpeechHere>"] if not already handled by logic

data:
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  prompt_path: "prompts/train_prompt.json"

train:
  batch_size: 4
  epochs: 5
  lr: 1e-4
  num_workers: 4

output_dir: "output_v3"
