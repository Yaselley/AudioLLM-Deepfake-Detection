model:
  llm_path: "/netscratch/fkallel/models/Qwen3.5-0.8B/"
  llm_type: "qwen3.5"

  audio_encoder_path: "/ds-slt/audio_weights/xlsr2_300m.pt"
  audio_encoder_type: "wav2vec2"
  audio_encoder_source: "fairseq"
  freeze_audio_encoder: true

  lora: false 
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05

  mlp_adaptor: true
  mlp_adaptor_only: true
  mlp_hidden_dim: 768
  mlp_dropout: 0.1
  mlp_num_classes: 2
  mlp_loss_weight: 0.5

  special_tokens: []

data:
  train_path: "data/hir_sdd_reasoning_train_clean.json"
  val_path: "data/hir_sdd_reasoning_val_clean.json"
  test_path: "data/hir_sdd_reasoning_test_clean.json"
  prompt_path: "prompts/train_prompt.json"

train:
  batch_size: 16
  epochs: 3
  lr: 1e-5
  lr_adapter: 1e-5
  lr_audio: 1e-6
  lr_lora: 1e-5
  num_workers: 4
  seed: 2
  grad_accum_steps: 2

output_dir: "output_v26/qwen3.5_0.8B_no_lora_2_hir_mlp_adaptor"